<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle guide lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="80" y1="380" x2="432" y2="380" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Stylized Bangla Letter 'অ' Hand-drawn Path -->
  <g filter="url(#glow)">
    <!-- Top Matra -->
    <path d="M 120 180 L 400 180" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <!-- Vowel loop and body -->
    <path d="M 190 250 C 190 200 140 200 140 250 C 140 310 300 290 300 400 C 300 470 190 500 140 450" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <path d="M 280 400 C 340 390 390 430 390 490 M 390 180 L 390 490" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Cute Magic Star / Sparkle in corner -->
  <path d="M 390 100 L 398 120 L 418 128 L 398 136 L 390 156 L 382 136 L 362 128 L 382 120 Z" fill="#fde047" />
  <circle cx="430" cy="160" r="5" fill="#fef08a" />
</svg>
